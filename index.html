<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<title>Выбери приз</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html { background: #1a0d0a; }

body {
  width: 100vw;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

/* ─────────────────────────────────────────────
   FRAME — fixed 540×960 design canvas, JS-scaled
   ───────────────────────────────────────────── */
.frame {
  width: 540px;
  height: 960px;
  position: relative;
  transform-origin: top left;
  overflow: hidden;
  flex-shrink: 0;
}

/* ─── SCREENS ─── */
.screen { display: none; position: absolute; inset: 0; }
.screen.active { display: block; }

/* ─── BACKGROUND ─── */
.bg { position: absolute; inset: 0; z-index: 0; }
.bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bg-overlay {
  position: absolute; inset: 0; z-index: 1;
  background: rgba(218, 189, 189, 0.54);
}

/* ─────────────────────────────────────────────
   TOP BAR ELEMENTS  (shared by both screens)
   ───────────────────────────────────────────── */
.back-btn {
  position: absolute; z-index: 10;
  left: 27px; top: 77px;
  width: 37px; height: 37px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ed9023 0%, #af3917 100%);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.back-btn img {
  width: 14px; height: 22px;
  object-fit: contain;
  transform: scaleX(-1);
  filter: brightness(0) invert(1);
}

.currency-pill {
  position: absolute; z-index: 10;
  left: 139px; top: 67px;
  height: 56px;
  padding: 8px 20px 8px 24px;
  background: rgba(234, 129, 36, 0.87);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 200px;
  display: flex; align-items: center; gap: 16px;
}
.currency-group { display: flex; align-items: center; gap: 6px; }
.currency-num {
  font-family: 'Inter', -apple-system, sans-serif;
  font-weight: 600; font-size: 28px;
  color: #fff; white-space: nowrap; line-height: 1;
}
.leaf-icon { width: 32px; height: 32px; object-fit: contain; }
.crystal-icon {
  width: 40px; height: 40px; object-fit: contain;
  transform: rotate(45deg);
  filter: drop-shadow(0 0 6px rgba(27,113,242,0.6));
}
.currency-sep {
  width: 4px; height: 28px;
  background: rgba(255,255,255,0.30);
  border-radius: 200px;
}

.profile-btn {
  position: absolute; z-index: 10;
  left: 432px; top: 51px;
  width: 88px; height: 88px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ed9023 0%, #af3917 100%);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.profile-btn img { width: 48px; height: 48px; object-fit: contain; }

/* ─────────────────────────────────────────────
   ALBUM SCREEN
   ───────────────────────────────────────────── */

.album-card {
  position: absolute; z-index: 5;
  left: 27px; top: 196px;
  width: 493px; height: 603px;
  background: rgba(255, 255, 255, 0.56);
  border: 1px solid #9e9564;
  border-radius: 20px;
  overflow: visible;
}

.slot-circle {
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%;
  overflow: hidden;
  transition: box-shadow 0.18s;
  cursor: default;
}
.slot-circle img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  pointer-events: none;
  -webkit-user-drag: none;
  z-index: 2;
}
.slot-circle.drop-target {
  box-shadow: 0 0 0 4px #ed9023, 0 0 22px rgba(237,144,35,0.65);
}

/* Slot number — centered, hidden when filled */
.slot-num {
  position: absolute;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-family: 'Inter', -apple-system, sans-serif;
  font-weight: 700; font-size: 65px;
  color: rgba(255,255,255,0.85);
  text-shadow: 0 1px 6px rgba(0,0,0,0.6);
  pointer-events: none; z-index: 1; line-height: 1;
  white-space: nowrap;
}
.slot-circle.filled .slot-num { display: none; }

.sticker-area {
  position: absolute; z-index: 6;
  left: 27px; top: 810px;
  width: 200px; height: 110px;
}
.sticker-chip {
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%; overflow: hidden;
  border: 3px solid #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,0.22);
  cursor: grab; touch-action: none;
  -webkit-user-select: none; user-select: none;
}
.sticker-chip:active { cursor: grabbing; }
.sticker-chip img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  pointer-events: none;
  -webkit-user-drag: none;
}
.sticker-badge {
  position: absolute;
  bottom: 0; right: 0;
  min-width: 28px; height: 28px;
  padding: 0 6px;
  border-radius: 14px;
  background: #ed9023; color: #fff;
  font-family: 'Inter', sans-serif;
  font-weight: 700; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  border: 2.5px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  pointer-events: none;
}

.album-caption {
  position: absolute; z-index: 5;
  left: 30px; top: 924px;
  color: #fff; font-size: 14.5px;
  font-family: 'Luckiest Guy', cursive;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  white-space: nowrap;
}

.btn-album-prize {
  position: absolute; z-index: 10;
  left: 333px; top: 828px;
  width: 172px; height: 70px;
  background: linear-gradient(180deg, #ed9123 0%, #de4426 100%);
  border: 0.528px solid #fff;
  border-radius: 5.3px;
  box-shadow: 0 2.1px 2.1px rgba(0,0,0,0.25);
  color: #fff;
  font-family: 'Luckiest Guy', cursive;
  font-size: 16px; letter-spacing: 0.3px;
  line-height: 1.2; text-align: center;
  cursor: pointer; padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ─────────────────────────────────────────────
   PRIZES / WHEEL SCREEN
   ───────────────────────────────────────────── */

.prizes-card {
  position: absolute; z-index: 5;
  left: 13px; top: 218px;
  width: 520px; height: 520px;
  background: rgba(255, 255, 255, 0.56);
  border: 0.945px solid #9e9564;
  border-radius: 18.9px;
  overflow: hidden;
}

#grid {
  position: absolute;
  left: 20px; top: 20px;
  display: grid;
  grid-template-columns: repeat(3, 140px);
  column-gap: 30px;
  row-gap: 30px;
}

/* ─── Card 3-D flip ─── */
.card {
  width: 140px; height: 140px;
  perspective: 500px;
  cursor: default;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.card.is-absolute {
  position: absolute;
  transition: top 0.3s ease, left 0.3s ease;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
  border-radius: 6.2px;
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.front, .back {
  position: absolute; inset: 0;
  border-radius: 6.2px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
}
.front {
  background: url('front.png') center/cover no-repeat;
  border: 1.55px solid #dab8af;
}
.prize-name {
  font-weight: 700;
  color: #1e293b; text-align: center;
  padding: 6px; line-height: 1.15;
  word-break: break-word; pointer-events: none;
  width: 100%;
}
.prize-img {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  object-fit: cover; border-radius: 6.2px;
  pointer-events: none;
}
.back {
  background: url('back.png') center/cover no-repeat;
  border: 1.55px solid #dab8af;
  transform: rotateY(180deg);
}

.card.selectable { cursor: pointer; }
.card.selectable:hover .back {
  border-color: #ed9023;
  box-shadow: 0 0 14px rgba(237,144,35,0.55);
}
.card.selected .front {
  background: linear-gradient(145deg, #14532d, #0f3d21);
  border-color: #22c55e;
  box-shadow: 0 0 22px rgba(34,197,94,0.55);
}
.card.selected .prize-name { color: #e2e8f0; }
.card.not-selected .front { opacity: 0.55; }

@keyframes popIn {
  0%   { transform: rotateY(0deg) scale(0.88); }
  60%  { transform: rotateY(0deg) scale(1.08); }
  100% { transform: rotateY(0deg) scale(1); }
}
.card.selected .card-inner {
  animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.card.removable { cursor: pointer; }
.card.removable:hover .back {
  border-color: #ef4444;
  box-shadow: 0 0 14px rgba(239,68,68,0.55);
}
@keyframes removeCard { to { opacity: 0; transform: scale(0.7); } }
.card.removing-anim .card-inner { animation: removeCard 0.28s ease forwards; }

#subtitle {
  position: absolute; z-index: 6;
  left: 13px; top: 728px;
  width: 520px; text-align: center;
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.95);
  text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  min-height: 16px; pointer-events: none;
  font-family: -apple-system, sans-serif;
}

/* Bottom buttons */
.btn-get-prize {
  position: absolute; z-index: 10;
  left: 106px; top: 752px;
  width: 326px; height: 50px;
  background: linear-gradient(180deg, #ed9123 0%, #de4426 100%);
  border: 1px solid #fff;
  border-radius: 10px;
  box-shadow: 0 4px 4px rgba(0,0,0,0.25);
  color: #fff;
  font-family: 'Luckiest Guy', cursive;
  font-size: 21px; letter-spacing: 0.3px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  gap: 8px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-get-prize:disabled {
  opacity: 0.55;
  cursor: not-allowed;
}
.spin-count-badge {
  display: inline-flex; align-items: center; justify-content: center;
  background: rgba(255,255,255,0.25);
  border: 1.5px solid rgba(255,255,255,0.6);
  border-radius: 20px;
  min-width: 34px; height: 28px;
  padding: 0 8px;
  font-size: 19px; font-weight: 700; line-height: 1;
}

.btn-remove-prize {
  position: absolute; z-index: 10;
  left: 103px; top: 816px;
  width: 326px; height: 50px;
  background: linear-gradient(180deg, #ed9123 0%, #de4426 100%);
  border: 1px solid #fff;
  border-radius: 10px;
  box-shadow: 0 4px 4px rgba(0,0,0,0.25);
  color: #fff;
  font-family: 'Luckiest Guy', cursive;
  font-size: 21px; letter-spacing: 0.3px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-remove-prize.removing {
  background: linear-gradient(180deg, #6b21a8 0%, #4c1d95 100%);
}

/* ─────────────────────────────────────────────
   POPUPS — shared overlay base
   ───────────────────────────────────────────── */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 200;
}
.popup-overlay.hidden { display: none; }
.popup-overlay.centered { align-items: center; }

.popup-card {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%; max-width: 540px; max-height: 72vh;
  display: flex; flex-direction: column;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
  overflow: hidden;
}
.popup-handle {
  width: 40px; height: 4px;
  background: rgba(0,0,0,0.1); border-radius: 2px;
  margin: 12px auto 0; flex-shrink: 0;
}
.popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; flex-shrink: 0;
}
.popup-header h2 { font-size: 1.05rem; font-weight: 700; color: #1c1917; }
.popup-close-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,0.06); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.82rem; color: #6b7280;
}
.popup-prizes-list { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
.popup-empty { text-align: center; color: #9ca3af; font-size: 0.88rem; padding: 36px 0; }
.prize-list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  font-size: 0.88rem; color: #1c1917;
}
.prize-list-item:last-child { border-bottom: none; }
.prize-list-icon {
  width: 36px; height: 36px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0; background: #fde8d0;
  display: flex; align-items: center; justify-content: center;
  font-size: 20px;
}
.prize-list-icon img { width: 100%; height: 100%; object-fit: cover; }
.prize-list-name { font-weight: 600; flex: 1; }
.prize-list-num  { color: #9ca3af; font-size: 0.78rem; }

/* ─── Buy-spins popup (centered) ─── */
.buy-spins-card {
  background: #fff;
  border-radius: 24px;
  width: 88%; max-width: 400px;
  display: flex; flex-direction: column;
  box-shadow: 0 8px 40px rgba(0,0,0,0.25);
  overflow: hidden;
}
.buy-spins-body {
  padding: 0 20px 28px;
  display: flex; flex-direction: column; gap: 18px;
}
.buy-spins-desc {
  font-size: 0.9rem; color: #4b5563; text-align: center;
}
.buy-spins-slider-wrap { display: flex; flex-direction: column; gap: 6px; }
.buy-spins-slider-wrap input[type=range] {
  width: 100%; accent-color: #ed9023;
  height: 6px; cursor: pointer;
}
.buy-spins-range-labels {
  display: flex; justify-content: space-between;
  font-size: 0.78rem; color: #9ca3af;
}
.buy-spins-info {
  background: #fef3e2; border-radius: 10px;
  padding: 12px 16px; text-align: center;
  font-size: 1.05rem; font-weight: 600; color: #92400e;
}
.btn-buy-spins {
  width: 100%; height: 48px;
  background: linear-gradient(180deg, #ed9123 0%, #de4426 100%);
  border: none; border-radius: 10px;
  color: #fff; font-family: 'Luckiest Guy', cursive;
  font-size: 20px; letter-spacing: 0.3px;
  cursor: pointer;
}
.btn-buy-spins:active { opacity: 0.85; }

/* ─── Prize reveal popup (centered) ─── */
.prize-popup-card {
  background: #fff;
  border-radius: 24px;
  width: 84%; max-width: 380px;
  padding: 44px 28px 32px;
  display: flex; flex-direction: column; align-items: center; gap: 18px;
  position: relative;
  box-shadow: 0 8px 40px rgba(0,0,0,0.3);
}
.prize-popup-close {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(0,0,0,0.07); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.85rem; color: #6b7280;
}
.prize-popup-icon {
  width: 110px; height: 110px;
  display: flex; align-items: center; justify-content: center;
  font-size: 80px; line-height: 1;
  border-radius: 50%; overflow: hidden;
  background: #fef3e2;
}
.prize-popup-icon img {
  width: 100%; height: 100%; object-fit: cover;
}
.prize-popup-name {
  font-family: 'Luckiest Guy', cursive;
  font-size: 22px; color: #1c1917; text-align: center;
  letter-spacing: 0.3px; line-height: 1.2;
}
.prize-popup-sub {
  font-size: 0.88rem; color: #6b7280; text-align: center;
}

/* ─── Drag ghost ─── */
.sticker-ghost {
  position: fixed; pointer-events: none; z-index: 300;
  width: 100px; height: 100px;
  border-radius: 50%; overflow: hidden;
  border: 3px solid #ed9023;
  box-shadow: 0 6px 22px rgba(237,144,35,0.55);
  opacity: 0.92;
  transform: translate(-50%, -50%);
}
.sticker-ghost img {
  width: 100%; height: 100%; object-fit: cover;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="frame" id="frame">

<!-- ══════════════════════════════════
     ALBUM SCREEN
══════════════════════════════════ -->
<div class="screen active" id="albumScreen">
  <div class="bg"><img id="bgAlbum" src="" alt=""></div>
  <div class="bg-overlay"></div>

  <div class="currency-pill">
    <div class="currency-group">
      <span class="currency-num" id="leafCount">300</span>
      <img class="leaf-icon" src="logo.png" alt="🍃">
    </div>
    <div class="currency-sep"></div>
    <div class="currency-group">
      <span class="currency-num" id="crystalCount">100</span>
      <img class="crystal-icon"
           src="https://www.figma.com/api/mcp/asset/c4d65d82-059b-4dd5-86aa-ce99e6eb01c9"
           alt="💎">
    </div>
  </div>
  <button class="profile-btn" id="profileBtnAlbum">
    <img src="https://www.figma.com/api/mcp/asset/d51206be-dd6d-4eac-8d0e-8776fd17a152" alt="">
  </button>

  <div class="album-card">
    <div id="slotGrid"></div>
  </div>

  <div class="sticker-area" id="stickerArea">
    <div class="sticker-badge" id="stickerBadge" style="display:none">0</div>
  </div>

  <p class="album-caption">перетащите наклейки в альбом</p>
  <button class="btn-album-prize" id="getAlbumPrizeBtn">ПОЛУЧИТЬ ПРИЗ</button>
</div>

<!-- ══════════════════════════════════
     PRIZES / WHEEL SCREEN
══════════════════════════════════ -->
<div class="screen" id="wheelScreen">
  <div class="bg"><img id="bgWheel" src="" alt=""></div>
  <div class="bg-overlay"></div>

  <button class="back-btn" id="backToAlbumBtn">
    <img src="https://www.figma.com/api/mcp/asset/bda0236e-b313-4f0d-80c6-ae5b2f46285a" alt="←">
  </button>
  <div class="currency-pill">
    <div class="currency-group">
      <span class="currency-num" id="leafCount2">300</span>
      <img class="leaf-icon" src="logo.png" alt="🍃">
    </div>
    <div class="currency-sep"></div>
    <div class="currency-group">
      <span class="currency-num" id="crystalCount2">100</span>
      <img class="crystal-icon"
           src="https://www.figma.com/api/mcp/asset/8b6bac20-d521-4b49-869e-2a3af4cf6576"
           alt="💎">
    </div>
  </div>
  <button class="profile-btn" id="profileBtnWheel">
    <img src="https://www.figma.com/api/mcp/asset/fee6ee5c-5b46-4379-bd53-be90b51a76a2" alt="">
  </button>

  <div class="prizes-card">
    <div id="grid"></div>
  </div>
  <p id="subtitle"></p>

  <button class="btn-get-prize" id="playBtn">
    ПОЛУЧИТЬ ПРИЗ <span class="spin-count-badge" id="spinCount">3</span>
  </button>
  <button class="btn-remove-prize" id="removeBtn">УБРАТЬ ПРИЗ (5💎)</button>
</div>

<!-- ══════════════════════════════════
     PROFILE POPUP
══════════════════════════════════ -->
<div class="popup-overlay hidden" id="profileOverlay">
  <div class="popup-card">
    <div class="popup-handle"></div>
    <div class="popup-header">
      <h2>Мои призы</h2>
      <button class="popup-close-btn" id="closeProfileBtn">✕</button>
    </div>
    <div class="popup-prizes-list" id="prizesList"></div>
  </div>
</div>

<!-- ══════════════════════════════════
     BUY SPINS POPUP (centered)
══════════════════════════════════ -->
<div class="popup-overlay hidden centered" id="buySpinsOverlay">
  <div class="buy-spins-card">
    <div class="popup-handle"></div>
    <div class="popup-header">
      <h2>Купить попытки</h2>
      <button class="popup-close-btn" id="closeBuySpinsBtn">✕</button>
    </div>
    <div class="buy-spins-body">
      <p class="buy-spins-desc">10 бонусов SPAR = 1 попытка</p>
      <div class="buy-spins-slider-wrap">
        <input type="range" id="buySpinsSlider" min="1" max="50" value="1">
        <div class="buy-spins-range-labels"><span>1</span><span>50</span></div>
      </div>
      <div class="buy-spins-info">
        <span id="buySpinsQty">1</span> попытка = <span id="buySpinsPrice">10</span> бонусов SPAR
      </div>
      <button class="btn-buy-spins" id="confirmBuySpinsBtn">КУПИТЬ</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════════
     PRIZE REVEAL POPUP (centered)
══════════════════════════════════ -->
<div class="popup-overlay hidden centered" id="prizePopupOverlay">
  <div class="prize-popup-card">
    <button class="prize-popup-close" id="closePrizePopupBtn">✕</button>
    <div class="prize-popup-icon" id="prizePopupIcon"></div>
    <h2 class="prize-popup-name" id="prizePopupName"></h2>
    <p class="prize-popup-sub" id="prizePopupSub"></p>
  </div>
</div>

</div><!-- /frame -->

<script>
/* ──────────────────────────────────────────────
   FIGMA ASSET URLs  (valid 7 days from fetch)
────────────────────────────────────────────── */
const ASSET = {
  emptySlot:  'https://www.figma.com/api/mcp/asset/f343fb62-2053-424c-ac3f-7886da10a064',
  filledSlot: 'https://www.figma.com/api/mcp/asset/fe77b678-f382-41af-8537-9776b8f658e2',
};

/* ──────────────────────────────────────────────
   PRIZES
   display: emoji/text to show on card face
   img:     local image path (overrides display)
   bonus:   if true — winning adds +1 spin
────────────────────────────────────────────── */
const ALL_PRIZES = [
  { name: 'Билет на iPhone',        display: '🎟️' },
  { name: '-15%',                   display: '-15%' },
  { name: '-20%',                   display: '-20%' },
  { name: '-30%',                   display: '-30%' },
  { name: 'Скидка на сладкое 30%',  display: 'Скидка на сладкое 30%' },
  { name: 'Скидка консервы 30%',    display: 'Скидка консервы 30%' },
  { name: 'Наклейка с котом',       img: 'back.png' },
  { name: 'Доп. попытка',           display: 'Доп.\nпопытка', bonus: true },
  { name: 'Кофе',                   display: '☕' },
];

/* ──────────────────────────────────────────────
   CONSTANTS
────────────────────────────────────────────── */
const MAX_CARDS      = 9;
const COLS           = 3;
const CARD_SZ        = 140;
const GAP_X          = 30;
const GAP_Y          = 30;
const SHUFFLE_ROUNDS = 6;
const ROUND_MS       = 350;
const FLIP_MS        = 500;
const FLIP_SETTLE_MS = 620;
const ALBUM_SIZE     = 20;

/* ──────────────────────────────────────────────
   STATE
────────────────────────────────────────────── */
let phase          = 'initial';
let prizes         = [];   // active prize objects
let cardOrder      = [];
let removedSlots   = new Set();
let removalsUsed   = 0;
let spins          = 3;
let crystals       = 100;
let leaves         = 300;
let earnedStickers = 10;
let filledSlots    = new Set();  // indices 0-19 filled in album
let wonPrizes      = [];

/* ──────────────────────────────────────────────
   FRAME SCALING
────────────────────────────────────────────── */
function scaleFrame() {
  const frame = document.getElementById('frame');
  const scale = window.innerWidth / 540;
  frame.style.transform       = `scale(${scale})`;
  frame.style.transformOrigin = 'top left';
  document.body.style.height  = Math.ceil(960 * scale) + 'px';
}
window.addEventListener('resize', scaleFrame);
scaleFrame();

/* ──────────────────────────────────────────────
   BACKGROUND
────────────────────────────────────────────── */
const bgFile = Math.random() < 0.5 ? 'background_1.png' : 'background_2.png';
document.getElementById('bgAlbum').src = bgFile;
document.getElementById('bgWheel').src = bgFile;

/* ──────────────────────────────────────────────
   HELPERS
────────────────────────────────────────────── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* Font size for text prizes based on content length */
function prizeFontSize(text) {
  const chars = [...text].length; // emoji-aware
  if (chars <= 2)  return '55px';
  if (chars <= 4)  return '40px';
  if (chars <= 8)  return '26px';
  if (chars <= 13) return '19px';
  return '15px';
}

/* ──────────────────────────────────────────────
   CURRENCY / SPIN UI
────────────────────────────────────────────── */
function updateCurrencyUI() {
  ['leafCount',    'leafCount2'].forEach(id => document.getElementById(id).textContent    = leaves);
  ['crystalCount', 'crystalCount2'].forEach(id => document.getElementById(id).textContent = crystals);
  document.getElementById('spinCount').textContent = spins;
  const btn = document.getElementById('playBtn');
  btn.disabled = phase !== 'initial';
}

/* ──────────────────────────────────────────────
   ALBUM — slot grid
   Slot positions in .album-card coordinate space:
   cols → 40, 148, 256, 364   rows → 29, 143, 257, 371, 485
────────────────────────────────────────────── */
const SLOT_COL = [40, 148, 256, 364];
const SLOT_ROW = [29, 143, 257, 371, 485];

function buildSlotGrid() {
  const grid = document.getElementById('slotGrid');
  grid.innerHTML = '';
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 4; c++) {
      const i   = r * 4 + c;
      const div = document.createElement('div');
      div.className     = 'slot-circle';
      div.dataset.index = i;
      div.style.left    = SLOT_COL[c] + 'px';
      div.style.top     = SLOT_ROW[r] + 'px';

      const img = document.createElement('img');
      img.src       = ASSET.emptySlot;
      img.alt       = String(i + 1);
      img.draggable = false;
      div.appendChild(img);

      const num = document.createElement('span');
      num.className   = 'slot-num';
      num.textContent = String(i + 1);
      div.appendChild(num);

      grid.appendChild(div);
    }
  }
}

function updateSlotGrid() {
  document.querySelectorAll('#slotGrid .slot-circle').forEach((s, i) => {
    const filled = filledSlots.has(i);
    s.querySelector('img').src = filled ? 'back.png' : ASSET.emptySlot;
    s.classList.toggle('filled', filled);
  });
}

/* Returns index of next empty slot (sequential), or -1 */
function getNextSlot() {
  for (let i = 0; i < ALBUM_SIZE; i++) {
    if (!filledSlots.has(i)) return i;
  }
  return -1;
}

/* ──────────────────────────────────────────────
   STICKER TRAY
────────────────────────────────────────────── */
function updateStickerTray() {
  const area  = document.getElementById('stickerArea');
  const badge = document.getElementById('stickerBadge');

  area.querySelectorAll('.sticker-chip').forEach(c => c.remove());

  if (earnedStickers === 0) {
    badge.style.display = 'none';
    return;
  }

  const vis = Math.min(5, earnedStickers);
  for (let i = 0; i < vis; i++) {
    const chip = document.createElement('div');
    chip.className  = 'sticker-chip';
    chip.style.left = (i * 23) + 'px';
    chip.style.top  = '5px';
    chip.style.zIndex = vis - i;
    const img = document.createElement('img');
    img.src       = 'back.png';
    img.alt       = 'стикер';
    img.draggable = false;
    chip.appendChild(img);
    chip.addEventListener('mousedown',  e => startDrag(e));
    chip.addEventListener('touchstart', e => startDrag(e), { passive: false });
    area.insertBefore(chip, badge);
  }

  const lastLeft = (vis - 1) * 23 + 100 - 20;
  badge.style.left    = lastLeft + 'px';
  badge.style.top     = '70px';
  badge.style.display = 'flex';
  badge.textContent   = earnedStickers;
}

/* ──────────────────────────────────────────────
   DRAG & DROP  — places sticker in next slot
────────────────────────────────────────────── */
let dragGhost = null, dragActive = false;

function startDrag(e) {
  if (earnedStickers === 0) return;
  e.preventDefault();
  dragActive = true;

  dragGhost = document.createElement('div');
  dragGhost.className = 'sticker-ghost';
  dragGhost.innerHTML = `<img src="back.png" alt="" draggable="false">`;
  document.body.appendChild(dragGhost);

  const { x, y } = getPos(e);
  posGhost(x, y);

  // Pre-highlight next slot
  highlightNextSlot();

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup',   onEnd);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend',  onEnd);
}

function highlightNextSlot() {
  document.querySelectorAll('.slot-circle.drop-target').forEach(s => s.classList.remove('drop-target'));
  const idx = getNextSlot();
  if (idx >= 0) {
    const s = document.querySelector(`#slotGrid .slot-circle[data-index="${idx}"]`);
    if (s) s.classList.add('drop-target');
  }
}

function getPos(e) {
  if (e.touches?.length)        return { x: e.touches[0].clientX,        y: e.touches[0].clientY };
  if (e.changedTouches?.length) return { x: e.changedTouches[0].clientX,  y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function posGhost(x, y) {
  dragGhost.style.left = x + 'px';
  dragGhost.style.top  = y + 'px';
}

function onMove(e) {
  if (!dragActive) return;
  e.preventDefault();
  const { x, y } = getPos(e);
  posGhost(x, y);
}

function onEnd(e) {
  if (!dragActive) return;
  dragActive = false;
  document.removeEventListener('mousemove', onMove);
  document.removeEventListener('mouseup',   onEnd);
  document.removeEventListener('touchmove', onMove);
  document.removeEventListener('touchend',  onEnd);
  document.querySelectorAll('.slot-circle.drop-target').forEach(s => s.classList.remove('drop-target'));

  // Accept drop if cursor is over album card area
  const { x, y } = getPos(e);
  dragGhost.style.display = 'none';
  const el = document.elementFromPoint(x, y);
  dragGhost.style.display = '';

  const overAlbum = el && (el.closest('.album-card') || el.closest('.sticker-area'));
  if (overAlbum && earnedStickers > 0) {
    const idx = getNextSlot();
    if (idx >= 0) {
      filledSlots.add(idx);
      earnedStickers--;
      updateSlotGrid();
      updateStickerTray();
    }
  }

  dragGhost?.remove();
  dragGhost = null;
}

/* ──────────────────────────────────────────────
   PROFILE POPUP
────────────────────────────────────────────── */
function openProfile() {
  const list = document.getElementById('prizesList');
  list.innerHTML = '';
  if (!wonPrizes.length) {
    list.innerHTML = '<div class="popup-empty">Вы ещё не выиграли ни одного приза</div>';
  } else {
    wonPrizes.slice().reverse().forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'prize-list-item';
      const iconHtml = p.img
        ? `<img src="${p.img}" alt="">`
        : `<span style="font-size:20px">${p.display || ''}</span>`;
      item.innerHTML = `
        <div class="prize-list-icon">${iconHtml}</div>
        <span class="prize-list-name">${p.name}</span>
        <span class="prize-list-num">#${wonPrizes.length - i}</span>`;
      list.appendChild(item);
    });
  }
  document.getElementById('profileOverlay').classList.remove('hidden');
}

document.getElementById('closeProfileBtn').addEventListener('click', () =>
  document.getElementById('profileOverlay').classList.add('hidden'));
document.getElementById('profileOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('profileOverlay'))
    document.getElementById('profileOverlay').classList.add('hidden');
});
document.getElementById('profileBtnAlbum').addEventListener('click', openProfile);
document.getElementById('profileBtnWheel').addEventListener('click', openProfile);

/* ──────────────────────────────────────────────
   BUY SPINS POPUP
────────────────────────────────────────────── */
function openBuySpins() {
  document.getElementById('buySpinsSlider').value = 1;
  updateBuySpinsUI();
  document.getElementById('buySpinsOverlay').classList.remove('hidden');
}

function updateBuySpinsUI() {
  const qty = Number(document.getElementById('buySpinsSlider').value);
  document.getElementById('buySpinsQty').textContent   = qty;
  document.getElementById('buySpinsPrice').textContent = qty * 10;
}

document.getElementById('buySpinsSlider').addEventListener('input', updateBuySpinsUI);
document.getElementById('confirmBuySpinsBtn').addEventListener('click', () => {
  spins += Number(document.getElementById('buySpinsSlider').value);
  document.getElementById('buySpinsOverlay').classList.add('hidden');
  updateCurrencyUI();
});
document.getElementById('closeBuySpinsBtn').addEventListener('click', () =>
  document.getElementById('buySpinsOverlay').classList.add('hidden'));
document.getElementById('buySpinsOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('buySpinsOverlay'))
    document.getElementById('buySpinsOverlay').classList.add('hidden');
});

/* ──────────────────────────────────────────────
   PRIZE REVEAL POPUP
────────────────────────────────────────────── */
function showPrizePopup(prize) {
  const iconEl = document.getElementById('prizePopupIcon');
  const nameEl = document.getElementById('prizePopupName');
  const subEl  = document.getElementById('prizePopupSub');

  if (prize.img) {
    iconEl.innerHTML = `<img src="${prize.img}" alt="">`;
  } else {
    iconEl.textContent = prize.display || prize.name;
  }
  nameEl.textContent = prize.name;
  subEl.textContent  = prize.bonus ? '+1 попытка добавлена!' : '';

  document.getElementById('prizePopupOverlay').classList.remove('hidden');
}

function closePrizePopup() {
  document.getElementById('prizePopupOverlay').classList.add('hidden');
  initGame();
}

document.getElementById('closePrizePopupBtn').addEventListener('click', closePrizePopup);
document.getElementById('prizePopupOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('prizePopupOverlay')) closePrizePopup();
});

/* ──────────────────────────────────────────────
   CARD GAME
────────────────────────────────────────────── */
function prizeCardContent(prize) {
  if (prize.img) {
    return `<img class="prize-img" src="${prize.img}" alt="${prize.name}">`;
  }
  const text = prize.display || prize.name;
  // Render newlines as <br>
  const html = text.replace(/\n/g, '<br>');
  return `<span class="prize-name" style="font-size:${prizeFontSize(text)}">${html}</span>`;
}

function renderCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < prizes.length; i++) {
    const el = document.createElement('div');
    el.className     = 'card';
    el.dataset.index = i;
    el.innerHTML     = `
      <div class="card-inner">
        <div class="front">${prizeCardContent(prizes[cardOrder[i]])}</div>
        <div class="back"></div>
      </div>`;
    grid.appendChild(el);
  }
}

function setCardsSelectable(on) {
  document.querySelectorAll('.card').forEach((c, i) => {
    if (on) {
      c.classList.add('selectable');
      c.addEventListener('click', () => onCardClick(i), { once: true });
    } else {
      c.classList.remove('selectable');
    }
  });
}

function setCardsRemovable(on) {
  document.querySelectorAll('.card').forEach((c, i) => {
    if (on) {
      if (removedSlots.has(i)) return;
      c.classList.add('removable');
      c.addEventListener('click', () => onRemoveCardClick(i), { once: true });
    } else {
      c.classList.remove('removable');
    }
  });
}

function updateRemoveBtn() {
  const btn = document.getElementById('removeBtn');
  if (removalsUsed >= 2) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.classList.remove('removing');
  const price = removalsUsed === 0 ? 5 : 10;
  btn.textContent = `УБРАТЬ ПРИЗ (${price}💎)`;
}

function initGame() {
  phase        = 'initial';
  prizes       = shuffle([...ALL_PRIZES]).slice(0, MAX_CARDS);
  cardOrder    = Array.from({ length: prizes.length }, (_, i) => i);
  removedSlots = new Set();
  removalsUsed = 0;
  renderCards();
  document.getElementById('subtitle').textContent = '';
  updateRemoveBtn();
  updateCurrencyUI();
}

function toggleRemoveMode() {
  if (phase === 'removing') {
    phase = 'initial';
    document.getElementById('subtitle').textContent = '';
    setCardsRemovable(false);
    updateRemoveBtn();
  } else if (phase === 'initial') {
    phase = 'removing';
    document.getElementById('subtitle').textContent = 'Нажми на карту, чтобы убрать её';
    document.getElementById('removeBtn').textContent = 'ОТМЕНА';
    document.getElementById('removeBtn').classList.add('removing');
    setCardsRemovable(true);
  }
}

function onRemoveCardClick(idx) {
  if (phase !== 'removing') return;
  setCardsRemovable(false);
  const cards = Array.from(document.querySelectorAll('.card'));
  cards[idx].classList.add('removing-anim');
  setTimeout(() => {
    removedSlots.add(idx);
    cards[idx].style.visibility = 'hidden';
    removalsUsed++;
    phase = 'initial';
    document.getElementById('subtitle').textContent = '';
    updateRemoveBtn();
  }, 300);
}

function startGame() {
  if (phase !== 'initial') return;
  if (spins <= 0) { openBuySpins(); return; }
  setCardsRemovable(false);

  if (removedSlots.size > 0) {
    prizes    = Array.from({ length: prizes.length }, (_, i) => i)
      .filter(i => !removedSlots.has(i))
      .map(i => prizes[cardOrder[i]]);
    cardOrder    = Array.from({ length: prizes.length }, (_, i) => i);
    removedSlots = new Set();
    renderCards();
  }

  phase = 'flipping';
  spins--;
  updateCurrencyUI();

  document.getElementById('removeBtn').hidden     = true;
  document.getElementById('subtitle').textContent = '';

  document.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));
  setTimeout(runShuffle, FLIP_SETTLE_MS);
}

function runShuffle() {
  phase = 'shuffling';
  const gridEl = document.getElementById('grid');
  const cards  = Array.from(gridEl.querySelectorAll('.card'));
  const n      = cards.length;

  const gridRect = gridEl.getBoundingClientRect();
  const initPos  = cards.map(c => {
    const r = c.getBoundingClientRect();
    return { top: r.top - gridRect.top, left: r.left - gridRect.left };
  });

  const cols = COLS;
  const rows = Math.ceil(n / cols);
  const gw   = cols * CARD_SZ + (cols - 1) * GAP_X;
  const gh   = rows * CARD_SZ + (rows - 1) * GAP_Y;
  gridEl.style.width   = gw + 'px';
  gridEl.style.height  = gh + 'px';
  gridEl.style.display = 'block';

  const slotPos = Array.from({ length: n }, (_, idx) => ({
    top:  Math.floor(idx / cols) * (CARD_SZ + GAP_Y),
    left: (idx % cols)           * (CARD_SZ + GAP_X),
  }));

  cards.forEach((c, i) => {
    c.classList.add('is-absolute');
    c.style.top    = initPos[i].top  + 'px';
    c.style.left   = initPos[i].left + 'px';
    c.style.width  = CARD_SZ + 'px';
    c.style.height = CARD_SZ + 'px';
  });

  let current = Array.from({ length: n }, (_, i) => i);
  let round   = 0;

  function doRound() {
    if (round >= SHUFFLE_ROUNDS) { finishShuffle(cards, current, slotPos, gridEl); return; }
    const idxs  = shuffle(Array.from({ length: n }, (_, i) => i));
    const pairs = Array.from({ length: Math.floor(n / 2) }, (_, p) => [idxs[p*2], idxs[p*2+1]]);
    pairs.forEach(([a, b]) => { const t = current[a]; current[a] = current[b]; current[b] = t; });
    cards.forEach((c, i) => {
      c.style.top  = slotPos[current[i]].top  + 'px';
      c.style.left = slotPos[current[i]].left + 'px';
    });
    round++;
    setTimeout(doRound, ROUND_MS);
  }
  setTimeout(doRound, 50);
}

function finishShuffle(cards, current, slotPos, gridEl) {
  setTimeout(() => {
    const n = cards.length;
    const s2c = new Array(n);
    current.forEach((slot, ci) => { s2c[slot] = ci; });
    const newOrder = s2c.map(ci => cardOrder[ci]);

    cards.forEach(c => {
      c.classList.remove('is-absolute');
      c.style.top = c.style.left = c.style.width = c.style.height = '';
    });
    gridEl.style.display = gridEl.style.width = gridEl.style.height = '';

    cardOrder = newOrder;
    renderCards();
    document.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));

    phase = 'waiting';
    document.getElementById('subtitle').textContent = 'Выбери карту';
    setCardsSelectable(true);
  }, ROUND_MS + 80);
}

function onCardClick(selectedIdx) {
  if (phase !== 'waiting') return;
  phase = 'revealing';
  setCardsSelectable(false);
  const cards = Array.from(document.querySelectorAll('.card'));
  cards[selectedIdx].classList.remove('flipped');
  cards[selectedIdx].classList.add('selected');
  setTimeout(() => revealAll(cards, selectedIdx), 300);
}

function revealAll(cards, selectedIdx) {
  // Reveal all non-selected cards one by one
  cards.forEach((c, i) => {
    if (i === selectedIdx) return;
    setTimeout(() => { c.classList.remove('flipped'); c.classList.add('not-selected'); }, i * 60);
  });

  // After all revealed → show prize popup
  const delay = cards.length * 60 + FLIP_MS;
  setTimeout(() => {
    phase = 'done';
    document.getElementById('subtitle').textContent = '';

    const prize = prizes[cardOrder[selectedIdx]];

    if (prize.bonus) spins++;
    wonPrizes.push(prize);
    earnedStickers++;
    updateStickerTray();
    updateCurrencyUI();

    showPrizePopup(prize);
  }, delay);
}

/* ──────────────────────────────────────────────
   EVENT BINDINGS
────────────────────────────────────────────── */
document.getElementById('playBtn').addEventListener('click', startGame);
document.getElementById('removeBtn').addEventListener('click', toggleRemoveMode);
document.getElementById('backToAlbumBtn').addEventListener('click', () => showScreen('albumScreen'));
document.getElementById('getAlbumPrizeBtn').addEventListener('click', () => {
  if (phase === 'done' || phase === 'initial') initGame();
  showScreen('wheelScreen');
});

/* ──────────────────────────────────────────────
   INIT
────────────────────────────────────────────── */
buildSlotGrid();
updateSlotGrid();
updateStickerTray();
initGame();
</script>
</body>
</html>
