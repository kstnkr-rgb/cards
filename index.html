<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
<title>Выбери приз</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

html { background: #1a0d0a; }

body {
  width: 100vw;
  overflow-x: hidden;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
}

/* ─────────────────────────────────────────────
   FRAME — fixed 540×960 design canvas, JS-scaled
   ───────────────────────────────────────────── */
.frame {
  width: 540px;
  height: 960px;
  position: relative;
  transform-origin: top left;
  overflow: hidden;
  flex-shrink: 0;
}

/* ─── SCREENS ─── */
.screen { display: none; position: absolute; inset: 0; }
.screen.active { display: block; }

/* ─── BACKGROUND ─── */
.bg { position: absolute; inset: 0; z-index: 0; }
.bg img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bg-overlay {
  position: absolute; inset: 0; z-index: 1;
  background: rgba(218, 189, 189, 0.54);
}

/* ─────────────────────────────────────────────
   TOP BAR ELEMENTS  (shared by both screens)
   ───────────────────────────────────────────── */
.back-btn {
  position: absolute; z-index: 10;
  left: 27px; top: 77px;
  width: 37px; height: 37px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ed9023 0%, #af3917 100%);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.back-btn img {
  width: 14px; height: 22px;
  object-fit: contain;
  transform: scaleX(-1); /* flip arrow to point left */
  filter: brightness(0) invert(1);
}

.currency-pill {
  position: absolute; z-index: 10;
  left: 139px; top: 67px;
  height: 56px;
  padding: 8px 20px 8px 24px;
  background: rgba(234, 129, 36, 0.87);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 200px;
  display: flex; align-items: center; gap: 16px;
}
.currency-group { display: flex; align-items: center; gap: 6px; }
.currency-num {
  font-family: 'Inter', -apple-system, sans-serif;
  font-weight: 600; font-size: 28px;
  color: #fff; white-space: nowrap; line-height: 1;
}
.leaf-icon { width: 32px; height: 32px; object-fit: contain; }
.crystal-icon {
  width: 40px; height: 40px; object-fit: contain;
  transform: rotate(45deg);
  filter: drop-shadow(0 0 6px rgba(27,113,242,0.6));
}
.currency-sep {
  width: 4px; height: 28px;
  background: rgba(255,255,255,0.30);
  border-radius: 200px;
}

.profile-btn {
  position: absolute; z-index: 10;
  left: 432px; top: 51px;
  width: 88px; height: 88px;
  border-radius: 50%;
  background: linear-gradient(180deg, #ed9023 0%, #af3917 100%);
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.profile-btn img { width: 48px; height: 48px; object-fit: contain; }

/* ─────────────────────────────────────────────
   ALBUM SCREEN
   ───────────────────────────────────────────── */

/* Main white card */
.album-card {
  position: absolute; z-index: 5;
  left: 27px; top: 196px;
  width: 493px; height: 603px;
  background: rgba(255, 255, 255, 0.56);
  border: 1px solid #9e9564;
  border-radius: 20px;
  overflow: visible;
}

/* Slot circles — positioned absolute inside .album-card */
.slot-circle {
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%;
  overflow: hidden;
  transition: box-shadow 0.18s;
  cursor: default;
}
.slot-circle img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  pointer-events: none; draggable: false;
  -webkit-user-drag: none;
}
.slot-circle.drop-target {
  box-shadow: 0 0 0 4px #ed9023, 0 0 22px rgba(237,144,35,0.65);
}

/* Sticker tray — absolute in frame space */
/* container offset: left=27 top=810 */
.sticker-area {
  position: absolute; z-index: 6;
  left: 27px; top: 810px;
  width: 200px; height: 110px;
}
.sticker-chip {
  position: absolute;
  width: 100px; height: 100px;
  border-radius: 50%; overflow: hidden;
  border: 3px solid #fff;
  box-shadow: 0 3px 10px rgba(0,0,0,0.22);
  cursor: grab; touch-action: none;
  -webkit-user-select: none; user-select: none;
}
.sticker-chip:active { cursor: grabbing; }
.sticker-chip img {
  width: 100%; height: 100%;
  object-fit: cover; display: block;
  pointer-events: none;
  -webkit-user-drag: none;
}
.sticker-badge {
  position: absolute;
  bottom: 0; right: 0;
  min-width: 28px; height: 28px;
  padding: 0 6px;
  border-radius: 14px;
  background: #ed9023; color: #fff;
  font-family: 'Inter', sans-serif;
  font-weight: 700; font-size: 15px;
  display: flex; align-items: center; justify-content: center;
  border: 2.5px solid #fff;
  box-shadow: 0 2px 6px rgba(0,0,0,0.2);
  pointer-events: none;
}

.album-caption {
  position: absolute; z-index: 5;
  left: 30px; top: 924px;
  color: #fff; font-size: 14.5px;
  font-family: 'Luckiest Guy', cursive;
  letter-spacing: 0.3px;
  text-shadow: 0 1px 4px rgba(0,0,0,0.35);
  white-space: nowrap;
}

/* "ПОЛУЧИТЬ ПРИЗ" on album — exact Figma position */
.btn-album-prize {
  position: absolute; z-index: 10;
  left: 333px; top: 828px;
  width: 172px; height: 70px;
  background: linear-gradient(180deg, #ed9123 0%, #de4426 100%);
  border: 0.528px solid #fff;
  border-radius: 5.3px;
  box-shadow: 0 2.1px 2.1px rgba(0,0,0,0.25);
  color: #fff;
  font-family: 'Luckiest Guy', cursive;
  font-size: 16px; letter-spacing: 0.3px;
  line-height: 1.2; text-align: center;
  cursor: pointer; padding: 0 8px;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

/* ─────────────────────────────────────────────
   PRIZES / WHEEL SCREEN
   ───────────────────────────────────────────── */

/* White game card */
.prizes-card {
  position: absolute; z-index: 5;
  left: 13px; top: 218px;
  width: 520px; height: 520px;
  background: rgba(255, 255, 255, 0.56);
  border: 0.945px solid #9e9564;
  border-radius: 18.9px;
  overflow: hidden;
}

/* Card game grid — exact Figma offset inside .prizes-card */
#grid {
  position: absolute;
  left: 20px; top: 16px;
  display: grid;
  grid-template-columns: repeat(4, 108.5px);
  column-gap: 15.5px;
  row-gap: 18.21px;
}

/* ─── Card 3-D flip ─── */
.card {
  width: 108.5px; height: 108.5px;
  perspective: 500px;
  cursor: default;
  -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.card.is-absolute {
  position: absolute;
  transition: top 0.3s ease, left 0.3s ease;
}
.card-inner {
  width: 100%; height: 100%;
  position: relative;
  transform-style: preserve-3d;
  transition: transform 0.5s ease;
  border-radius: 6.2px;
}
.card.flipped .card-inner { transform: rotateY(180deg); }

.front, .back {
  position: absolute; inset: 0;
  border-radius: 6.2px;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  display: flex; align-items: center; justify-content: center;
}
.front {
  background: url('front.png') center/cover no-repeat;
  border: 1.55px solid #dab8af;
}
.prize-name {
  font-size: 9px; font-weight: 700;
  color: #1e293b; text-align: center;
  padding: 5px 4px; line-height: 1.25;
  word-break: break-word; pointer-events: none;
}
.back {
  background: url('back.png') center/cover no-repeat;
  border: 1.55px solid #dab8af;
  transform: rotateY(180deg);
}

.card.selectable { cursor: pointer; }
.card.selectable:hover .back {
  border-color: #ed9023;
  box-shadow: 0 0 14px rgba(237,144,35,0.55);
}
.card.selected .front {
  background: linear-gradient(145deg, #14532d, #0f3d21);
  border-color: #22c55e;
  box-shadow: 0 0 22px rgba(34,197,94,0.55);
}
.card.selected .prize-name { color: #e2e8f0; font-size: 10px; }
.card.not-selected .front { opacity: 0.55; }

@keyframes popIn {
  0%   { transform: rotateY(0deg) scale(0.88); }
  60%  { transform: rotateY(0deg) scale(1.08); }
  100% { transform: rotateY(0deg) scale(1); }
}
.card.selected .card-inner {
  animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
}

.card.removable { cursor: pointer; }
.card.removable:hover .back {
  border-color: #ef4444;
  box-shadow: 0 0 14px rgba(239,68,68,0.55);
}
@keyframes removeCard { to { opacity: 0; transform: scale(0.7); } }
.card.removing-anim .card-inner { animation: removeCard 0.28s ease forwards; }

/* Status text */
#subtitle {
  position: absolute; z-index: 6;
  left: 13px; top: 728px;
  width: 520px; text-align: center;
  font-size: 13px; font-weight: 600;
  color: rgba(255,255,255,0.95);
  text-shadow: 0 1px 4px rgba(0,0,0,0.4);
  min-height: 16px; pointer-events: none;
  font-family: -apple-system, sans-serif;
}

/* Bottom buttons — exact Figma positions */
.btn-get-prize {
  position: absolute; z-index: 10;
  left: 106px; top: 752px;
  width: 326px; height: 50px;
  background: linear-gradient(180deg, #ed9123 0%, #de4426 100%);
  border: 1px solid #fff;
  border-radius: 10px;
  box-shadow: 0 4px 4px rgba(0,0,0,0.25);
  color: #fff;
  font-family: 'Luckiest Guy', cursive;
  font-size: 21px; letter-spacing: 0.3px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-get-prize:disabled {
  background: linear-gradient(180deg, #aaa 0%, #777 100%);
  cursor: not-allowed;
  box-shadow: none;
}

.btn-remove-prize {
  position: absolute; z-index: 10;
  left: 103px; top: 816px;
  width: 326px; height: 50px;
  background: linear-gradient(180deg, #ed9123 0%, #de4426 100%);
  border: 1px solid #fff;
  border-radius: 10px;
  box-shadow: 0 4px 4px rgba(0,0,0,0.25);
  color: #fff;
  font-family: 'Luckiest Guy', cursive;
  font-size: 21px; letter-spacing: 0.3px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.btn-remove-prize.removing {
  background: linear-gradient(180deg, #6b21a8 0%, #4c1d95 100%);
}

#replayBtn {
  position: absolute; z-index: 10;
  left: 50%; top: 882px;
  transform: translateX(-50%);
  padding: 10px 36px;
  background: rgba(255,255,255,0.18);
  border: 1px solid rgba(255,255,255,0.5);
  border-radius: 10px;
  color: #fff;
  font-family: 'Luckiest Guy', cursive;
  font-size: 19px; letter-spacing: 0.5px;
  cursor: pointer;
  backdrop-filter: blur(8px);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  white-space: nowrap;
}

/* ─────────────────────────────────────────────
   PROFILE POPUP
   ───────────────────────────────────────────── */
.popup-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.45);
  display: flex; align-items: flex-end; justify-content: center;
  z-index: 200;
}
.popup-overlay.hidden { display: none; }
.popup-card {
  background: #fff;
  border-radius: 24px 24px 0 0;
  width: 100%; max-width: 540px; max-height: 72vh;
  display: flex; flex-direction: column;
  box-shadow: 0 -8px 40px rgba(0,0,0,0.2);
  overflow: hidden;
}
.popup-handle {
  width: 40px; height: 4px;
  background: rgba(0,0,0,0.1); border-radius: 2px;
  margin: 12px auto 0; flex-shrink: 0;
}
.popup-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 20px 10px; flex-shrink: 0;
}
.popup-header h2 { font-size: 1.05rem; font-weight: 700; color: #1c1917; }
.popup-close-btn {
  width: 30px; height: 30px; border-radius: 50%;
  background: rgba(0,0,0,0.06); border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  font-size: 0.82rem; color: #6b7280;
}
.popup-prizes-list { flex: 1; overflow-y: auto; padding: 0 20px 24px; }
.popup-empty { text-align: center; color: #9ca3af; font-size: 0.88rem; padding: 36px 0; }
.prize-list-item {
  display: flex; align-items: center; gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid rgba(0,0,0,0.06);
  font-size: 0.88rem; color: #1c1917;
}
.prize-list-item:last-child { border-bottom: none; }
.prize-list-icon {
  width: 36px; height: 36px; border-radius: 50%;
  overflow: hidden; flex-shrink: 0; background: #fde8d0;
}
.prize-list-icon img { width: 100%; height: 100%; object-fit: cover; }
.prize-list-name { font-weight: 600; flex: 1; }
.prize-list-num  { color: #9ca3af; font-size: 0.78rem; }

/* ─── Drag ghost ─── */
.sticker-ghost {
  position: fixed; pointer-events: none; z-index: 300;
  width: 100px; height: 100px;
  border-radius: 50%; overflow: hidden;
  border: 3px solid #ed9023;
  box-shadow: 0 6px 22px rgba(237,144,35,0.55);
  opacity: 0.92;
  transform: translate(-50%, -50%);
}
.sticker-ghost img {
  width: 100%; height: 100%; object-fit: cover;
  pointer-events: none;
}
</style>
</head>
<body>

<div class="frame" id="frame">

<!-- ══════════════════════════════════
     ALBUM SCREEN
══════════════════════════════════ -->
<div class="screen active" id="albumScreen">
  <div class="bg"><img id="bgAlbum" src="" alt=""></div>
  <div class="bg-overlay"></div>

  <!-- Top bar (no back arrow — album is home) -->
  <div class="currency-pill">
    <div class="currency-group">
      <span class="currency-num" id="leafCount">300</span>
      <img class="leaf-icon" src="logo.png" alt="🍃">
    </div>
    <div class="currency-sep"></div>
    <div class="currency-group">
      <span class="currency-num" id="crystalCount">100</span>
      <img class="crystal-icon"
           src="https://www.figma.com/api/mcp/asset/c4d65d82-059b-4dd5-86aa-ce99e6eb01c9"
           alt="💎">
    </div>
  </div>
  <button class="profile-btn" id="profileBtnAlbum">
    <img src="https://www.figma.com/api/mcp/asset/d51206be-dd6d-4eac-8d0e-8776fd17a152" alt="">
  </button>

  <!-- Slot grid card -->
  <div class="album-card">
    <div id="slotGrid"></div>
  </div>

  <!-- Sticker tray -->
  <div class="sticker-area" id="stickerArea">
    <div class="sticker-badge" id="stickerBadge" style="display:none">0</div>
  </div>

  <p class="album-caption">перетащите наклейки в альбом</p>
  <button class="btn-album-prize" id="getAlbumPrizeBtn">ПОЛУЧИТЬ ПРИЗ</button>
</div>

<!-- ══════════════════════════════════
     PRIZES / WHEEL SCREEN
══════════════════════════════════ -->
<div class="screen" id="wheelScreen">
  <div class="bg"><img id="bgWheel" src="" alt=""></div>
  <div class="bg-overlay"></div>

  <!-- Top bar -->
  <button class="back-btn" id="backToAlbumBtn">
    <img src="https://www.figma.com/api/mcp/asset/bda0236e-b313-4f0d-80c6-ae5b2f46285a" alt="←">
  </button>
  <div class="currency-pill">
    <div class="currency-group">
      <span class="currency-num" id="leafCount2">300</span>
      <img class="leaf-icon" src="logo.png" alt="🍃">
    </div>
    <div class="currency-sep"></div>
    <div class="currency-group">
      <span class="currency-num" id="crystalCount2">100</span>
      <img class="crystal-icon"
           src="https://www.figma.com/api/mcp/asset/8b6bac20-d521-4b49-869e-2a3af4cf6576"
           alt="💎">
    </div>
  </div>
  <button class="profile-btn" id="profileBtnWheel">
    <img src="https://www.figma.com/api/mcp/asset/fee6ee5c-5b46-4379-bd53-be90b51a76a2" alt="">
  </button>

  <!-- Game -->
  <div class="prizes-card">
    <div id="grid"></div>
  </div>
  <p id="subtitle"></p>

  <!-- Buttons -->
  <button class="btn-get-prize" id="playBtn">ПОЛУЧИТЬ ПРИЗ (5💎)</button>
  <button class="btn-remove-prize" id="removeBtn">УБРАТЬ ПРИЗ (5💎)</button>
  <button id="replayBtn" hidden>ЕЩЁ РАЗ</button>
</div>

<!-- ══════════════════════════════════
     PROFILE POPUP
══════════════════════════════════ -->
<div class="popup-overlay hidden" id="profileOverlay">
  <div class="popup-card">
    <div class="popup-handle"></div>
    <div class="popup-header">
      <h2>Мои призы</h2>
      <button class="popup-close-btn" id="closeProfileBtn">✕</button>
    </div>
    <div class="popup-prizes-list" id="prizesList"></div>
  </div>
</div>

</div><!-- /frame -->

<script>
/* ──────────────────────────────────────────────
   FIGMA ASSET URLs  (valid 7 days from fetch)
────────────────────────────────────────────── */
const ASSET = {
  emptySlot:  'https://www.figma.com/api/mcp/asset/f343fb62-2053-424c-ac3f-7886da10a064',
  filledSlot: 'https://www.figma.com/api/mcp/asset/fe77b678-f382-41af-8537-9776b8f658e2',
};

/* ──────────────────────────────────────────────
   CONSTANTS
────────────────────────────────────────────── */
const ALL_PRIZES = [
  'Кофе', '-10%', '-15%', '-20%', 'Фишка с котом',
  'Скидка на сладкое', 'Кошачий корм', 'Предсказание',
  '50 бонусов', 'Билет', 'Доп. ход',
  'Чай', '-25%', 'Сюрприз', 'Брелок', 'Наклейка'
];
const MAX_CARDS      = 16;
const COLS           = 4;
const CARD_SZ        = 108.5;
const GAP_X          = 15.5;
const GAP_Y          = 18.21;
const SHUFFLE_ROUNDS = 6;
const ROUND_MS       = 350;
const FLIP_MS        = 500;
const FLIP_SETTLE_MS = 620;
const ALBUM_SIZE     = 20;
const SPIN_COST      = 5;

/* ──────────────────────────────────────────────
   STATE
────────────────────────────────────────────── */
let phase          = 'initial';
let prizes         = [];
let cardOrder      = [];
let removedSlots   = new Set();
let removalsUsed   = 0;
let crystals       = 100;
let leaves         = 300;
let earnedStickers = 0;
let filledSlots    = new Set();
let wonPrizes      = [];

/* ──────────────────────────────────────────────
   FRAME SCALING
────────────────────────────────────────────── */
function scaleFrame() {
  const frame = document.getElementById('frame');
  const scale = window.innerWidth / 540;
  frame.style.transform       = `scale(${scale})`;
  frame.style.transformOrigin = 'top left';
  document.body.style.height  = Math.ceil(960 * scale) + 'px';
}
window.addEventListener('resize', scaleFrame);
scaleFrame();

/* ──────────────────────────────────────────────
   BACKGROUND
────────────────────────────────────────────── */
const bgFile = Math.random() < 0.5 ? 'background_1.png' : 'background_2.png';
document.getElementById('bgAlbum').src = bgFile;
document.getElementById('bgWheel').src = bgFile;

/* ──────────────────────────────────────────────
   HELPERS
────────────────────────────────────────────── */
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ──────────────────────────────────────────────
   CURRENCY UI
────────────────────────────────────────────── */
function updateCurrencyUI() {
  ['leafCount',    'leafCount2'].forEach(id => document.getElementById(id).textContent    = leaves);
  ['crystalCount', 'crystalCount2'].forEach(id => document.getElementById(id).textContent = crystals);
  const btn = document.getElementById('playBtn');
  btn.disabled = (crystals < SPIN_COST || phase !== 'initial');
}

/* ──────────────────────────────────────────────
   ALBUM — slot grid
   Slot positions in .album-card coordinate space:
   cols (from Figma frame): 67,175,283,391 → minus card.left(27) = 40,148,256,364
   rows (from Figma frame): 225,339,453,567,681 → minus card.top(196) = 29,143,257,371,485
────────────────────────────────────────────── */
const SLOT_COL = [40, 148, 256, 364];
const SLOT_ROW = [29, 143, 257, 371, 485];

function buildSlotGrid() {
  const grid = document.getElementById('slotGrid');
  grid.innerHTML = '';
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c < 4; c++) {
      const i   = r * 4 + c;
      const div = document.createElement('div');
      div.className      = 'slot-circle';
      div.dataset.index  = i;
      div.style.left     = SLOT_COL[c] + 'px';
      div.style.top      = SLOT_ROW[r] + 'px';
      const img = document.createElement('img');
      img.src = ASSET.emptySlot;
      img.alt = String(i + 1);
      img.draggable = false;
      div.appendChild(img);
      grid.appendChild(div);
    }
  }
}

function updateSlotGrid() {
  document.querySelectorAll('#slotGrid .slot-circle').forEach((s, i) => {
    s.querySelector('img').src = filledSlots.has(i) ? ASSET.filledSlot : ASSET.emptySlot;
  });
}

/* ──────────────────────────────────────────────
   STICKER TRAY
   Chips stacked 23px apart: positions 0,23,46,69,92 (left within .sticker-area)
────────────────────────────────────────────── */
function updateStickerTray() {
  const area  = document.getElementById('stickerArea');
  const badge = document.getElementById('stickerBadge');

  // Remove old chips (leave badge in DOM)
  area.querySelectorAll('.sticker-chip').forEach(c => c.remove());

  if (earnedStickers === 0) {
    badge.style.display = 'none';
    return;
  }

  const vis = Math.min(5, earnedStickers);
  for (let i = 0; i < vis; i++) {
    const chip = document.createElement('div');
    chip.className    = 'sticker-chip';
    chip.style.left   = (i * 23) + 'px';
    chip.style.top    = '5px';
    chip.style.zIndex = vis - i;
    const img = document.createElement('img');
    img.src       = ASSET.filledSlot;
    img.alt       = 'стикер';
    img.draggable = false;
    chip.appendChild(img);
    chip.addEventListener('mousedown',  e => startDrag(e));
    chip.addEventListener('touchstart', e => startDrag(e), { passive: false });
    area.insertBefore(chip, badge); // insert before badge so z-index stacks correctly
  }

  // Badge position: right edge of last chip + a little
  const lastLeft = (vis - 1) * 23 + 100 - 20;
  badge.style.left    = lastLeft + 'px';
  badge.style.top     = '70px';
  badge.style.display = 'flex';
  badge.textContent   = earnedStickers;
}

/* ──────────────────────────────────────────────
   DRAG & DROP
────────────────────────────────────────────── */
let dragGhost = null, dragActive = false, dropSlot = null;

function startDrag(e) {
  if (earnedStickers === 0) return;
  e.preventDefault();
  dragActive = true;

  dragGhost = document.createElement('div');
  dragGhost.className = 'sticker-ghost';
  dragGhost.innerHTML = `<img src="${ASSET.filledSlot}" alt="" draggable="false">`;
  document.body.appendChild(dragGhost);

  const { x, y } = getPos(e);
  posGhost(x, y);

  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup',   onEnd);
  document.addEventListener('touchmove', onMove, { passive: false });
  document.addEventListener('touchend',  onEnd);
}

function getPos(e) {
  if (e.touches?.length)        return { x: e.touches[0].clientX,        y: e.touches[0].clientY };
  if (e.changedTouches?.length) return { x: e.changedTouches[0].clientX,  y: e.changedTouches[0].clientY };
  return { x: e.clientX, y: e.clientY };
}
function posGhost(x, y) {
  dragGhost.style.left = x + 'px';
  dragGhost.style.top  = y + 'px';
}

function onMove(e) {
  if (!dragActive) return;
  e.preventDefault();
  const { x, y } = getPos(e);
  posGhost(x, y);

  dragGhost.style.display = 'none';
  const el = document.elementFromPoint(x, y);
  dragGhost.style.display = '';

  document.querySelectorAll('.slot-circle.drop-target').forEach(s => s.classList.remove('drop-target'));
  dropSlot = null;

  if (el) {
    const s = el.closest('#slotGrid .slot-circle');
    if (s && !filledSlots.has(Number(s.dataset.index))) {
      s.classList.add('drop-target');
      dropSlot = s;
    }
  }
}

function onEnd() {
  if (!dragActive) return;
  dragActive = false;
  document.removeEventListener('mousemove', onMove);
  document.removeEventListener('mouseup',   onEnd);
  document.removeEventListener('touchmove', onMove);
  document.removeEventListener('touchend',  onEnd);
  document.querySelectorAll('.slot-circle.drop-target').forEach(s => s.classList.remove('drop-target'));

  if (dropSlot && earnedStickers > 0) {
    const idx = Number(dropSlot.dataset.index);
    if (!filledSlots.has(idx)) {
      filledSlots.add(idx);
      earnedStickers--;
      updateSlotGrid();
      updateStickerTray();
    }
    dropSlot = null;
  }

  dragGhost?.remove();
  dragGhost = null;
}

/* ──────────────────────────────────────────────
   PROFILE POPUP
────────────────────────────────────────────── */
function openProfile() {
  const list = document.getElementById('prizesList');
  list.innerHTML = '';
  if (!wonPrizes.length) {
    list.innerHTML = '<div class="popup-empty">Вы ещё не выиграли ни одного приза</div>';
  } else {
    wonPrizes.slice().reverse().forEach((p, i) => {
      const item = document.createElement('div');
      item.className = 'prize-list-item';
      item.innerHTML = `
        <div class="prize-list-icon"><img src="${ASSET.filledSlot}" alt=""></div>
        <span class="prize-list-name">${p.name}</span>
        <span class="prize-list-num">#${wonPrizes.length - i}</span>`;
      list.appendChild(item);
    });
  }
  document.getElementById('profileOverlay').classList.remove('hidden');
}

document.getElementById('closeProfileBtn').addEventListener('click', () =>
  document.getElementById('profileOverlay').classList.add('hidden'));
document.getElementById('profileOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('profileOverlay'))
    document.getElementById('profileOverlay').classList.add('hidden');
});
document.getElementById('profileBtnAlbum').addEventListener('click', openProfile);
document.getElementById('profileBtnWheel').addEventListener('click', openProfile);

/* ──────────────────────────────────────────────
   CARD GAME
────────────────────────────────────────────── */
function renderCards() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  for (let i = 0; i < prizes.length; i++) {
    const el = document.createElement('div');
    el.className     = 'card';
    el.dataset.index = i;
    el.innerHTML     = `
      <div class="card-inner">
        <div class="front"><span class="prize-name">${prizes[cardOrder[i]]}</span></div>
        <div class="back"></div>
      </div>`;
    grid.appendChild(el);
  }
}

function setCardsSelectable(on) {
  document.querySelectorAll('.card').forEach((c, i) => {
    if (on) {
      c.classList.add('selectable');
      c.addEventListener('click', () => onCardClick(i), { once: true });
    } else {
      c.classList.remove('selectable');
    }
  });
}

function setCardsRemovable(on) {
  document.querySelectorAll('.card').forEach((c, i) => {
    if (on) {
      if (removedSlots.has(i)) return;
      c.classList.add('removable');
      c.addEventListener('click', () => onRemoveCardClick(i), { once: true });
    } else {
      c.classList.remove('removable');
    }
  });
}

function updateRemoveBtn() {
  const btn = document.getElementById('removeBtn');
  if (removalsUsed >= 2) { btn.hidden = true; return; }
  btn.hidden = false;
  btn.classList.remove('removing');
  const price = removalsUsed === 0 ? 5 : 10;
  btn.textContent = `УБРАТЬ ПРИЗ (${price}💎)`;
}

function initGame() {
  phase        = 'initial';
  prizes       = shuffle([...ALL_PRIZES]).slice(0, MAX_CARDS);
  cardOrder    = Array.from({ length: prizes.length }, (_, i) => i);
  removedSlots = new Set();
  removalsUsed = 0;
  renderCards();
  document.getElementById('subtitle').textContent = '';
  document.getElementById('replayBtn').hidden     = true;
  updateRemoveBtn();
  updateCurrencyUI();
}

function toggleRemoveMode() {
  if (phase === 'removing') {
    phase = 'initial';
    document.getElementById('subtitle').textContent = '';
    setCardsRemovable(false);
    updateRemoveBtn();
  } else if (phase === 'initial') {
    phase = 'removing';
    document.getElementById('subtitle').textContent = 'Нажми на карту, чтобы убрать её';
    document.getElementById('removeBtn').textContent = 'ОТМЕНА';
    document.getElementById('removeBtn').classList.add('removing');
    setCardsRemovable(true);
  }
}

function onRemoveCardClick(idx) {
  if (phase !== 'removing') return;
  setCardsRemovable(false);
  const cards = Array.from(document.querySelectorAll('.card'));
  cards[idx].classList.add('removing-anim');
  setTimeout(() => {
    removedSlots.add(idx);
    cards[idx].style.visibility = 'hidden';
    removalsUsed++;
    phase = 'initial';
    document.getElementById('subtitle').textContent = '';
    updateRemoveBtn();
  }, 300);
}

function startGame() {
  if (phase !== 'initial' || crystals < SPIN_COST) return;
  setCardsRemovable(false);

  // Rebuild without removed slots
  if (removedSlots.size > 0) {
    prizes       = Array.from({ length: prizes.length }, (_, i) => i)
      .filter(i => !removedSlots.has(i))
      .map(i => prizes[cardOrder[i]]);
    cardOrder    = Array.from({ length: prizes.length }, (_, i) => i);
    removedSlots = new Set();
    renderCards();
  }

  phase = 'flipping';
  crystals -= SPIN_COST;
  updateCurrencyUI();

  document.getElementById('replayBtn').hidden     = true;
  document.getElementById('removeBtn').hidden     = true;
  document.getElementById('subtitle').textContent = '';

  document.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));
  setTimeout(runShuffle, FLIP_SETTLE_MS);
}

function runShuffle() {
  phase = 'shuffling';
  const gridEl = document.getElementById('grid');
  const cards  = Array.from(gridEl.querySelectorAll('.card'));
  const n      = cards.length;

  // Snapshot positions before freezing layout
  const gridRect = gridEl.getBoundingClientRect();
  const initPos  = cards.map(c => {
    const r = c.getBoundingClientRect();
    return { top: r.top - gridRect.top, left: r.left - gridRect.left };
  });

  // Freeze grid to block-display with known size
  const cols     = COLS;
  const rows     = Math.ceil(n / cols);
  const gw       = cols * CARD_SZ + (cols - 1) * GAP_X;
  const gh       = rows * CARD_SZ + (rows - 1) * GAP_Y;
  gridEl.style.width   = gw + 'px';
  gridEl.style.height  = gh + 'px';
  gridEl.style.display = 'block';

  // Precompute target slot positions
  const slotPos = Array.from({ length: n }, (_, idx) => ({
    top:  Math.floor(idx / cols) * (CARD_SZ + GAP_Y),
    left: (idx % cols)           * (CARD_SZ + GAP_X),
  }));

  // Make cards absolute
  cards.forEach((c, i) => {
    c.classList.add('is-absolute');
    c.style.top    = initPos[i].top  + 'px';
    c.style.left   = initPos[i].left + 'px';
    c.style.width  = CARD_SZ + 'px';
    c.style.height = CARD_SZ + 'px';
  });

  let current = Array.from({ length: n }, (_, i) => i);
  let round   = 0;

  function doRound() {
    if (round >= SHUFFLE_ROUNDS) { finishShuffle(cards, current, slotPos, gridEl); return; }
    const idxs  = shuffle(Array.from({ length: n }, (_, i) => i));
    const pairs = Array.from({ length: Math.floor(n / 2) }, (_, p) => [idxs[p*2], idxs[p*2+1]]);
    pairs.forEach(([a, b]) => { const t = current[a]; current[a] = current[b]; current[b] = t; });
    cards.forEach((c, i) => {
      c.style.top  = slotPos[current[i]].top  + 'px';
      c.style.left = slotPos[current[i]].left + 'px';
    });
    round++;
    setTimeout(doRound, ROUND_MS);
  }
  setTimeout(doRound, 50);
}

function finishShuffle(cards, current, slotPos, gridEl) {
  setTimeout(() => {
    const n = cards.length;
    const s2c = new Array(n);
    current.forEach((slot, ci) => { s2c[slot] = ci; });
    const newOrder = s2c.map(ci => cardOrder[ci]);

    cards.forEach(c => {
      c.classList.remove('is-absolute');
      c.style.top = c.style.left = c.style.width = c.style.height = '';
    });
    gridEl.style.display = gridEl.style.width = gridEl.style.height = '';

    cardOrder = newOrder;
    renderCards();
    document.querySelectorAll('.card').forEach(c => c.classList.add('flipped'));

    phase = 'waiting';
    document.getElementById('subtitle').textContent = 'Выбери карту';
    setCardsSelectable(true);
  }, ROUND_MS + 80);
}

function onCardClick(selectedIdx) {
  if (phase !== 'waiting') return;
  phase = 'revealing';
  setCardsSelectable(false);
  const cards = Array.from(document.querySelectorAll('.card'));
  cards[selectedIdx].classList.remove('flipped');
  cards[selectedIdx].classList.add('selected');
  setTimeout(() => revealAll(cards, selectedIdx), 300);
}

function revealAll(cards, selectedIdx) {
  cards.forEach((c, i) => {
    if (i === selectedIdx) return;
    setTimeout(() => { c.classList.remove('flipped'); c.classList.add('not-selected'); }, i * 50);
  });
  setTimeout(() => {
    phase = 'done';
    const name = prizes[cardOrder[selectedIdx]];
    document.getElementById('subtitle').textContent = `🎉 ${name}`;
    document.getElementById('replayBtn').hidden = false;
    updateRemoveBtn();
    updateCurrencyUI();
    wonPrizes.push({ name });
    earnedStickers++;
    updateStickerTray();
  }, cards.length * 50 + FLIP_MS);
}

/* ──────────────────────────────────────────────
   EVENT BINDINGS
────────────────────────────────────────────── */
document.getElementById('playBtn').addEventListener('click',         startGame);
document.getElementById('replayBtn').addEventListener('click',       initGame);
document.getElementById('removeBtn').addEventListener('click',       toggleRemoveMode);
document.getElementById('backToAlbumBtn').addEventListener('click',  () => showScreen('albumScreen'));
document.getElementById('getAlbumPrizeBtn').addEventListener('click', () => {
  if (phase === 'done' || phase === 'initial') initGame();
  showScreen('wheelScreen');
});

/* ──────────────────────────────────────────────
   INIT
────────────────────────────────────────────── */
buildSlotGrid();
updateSlotGrid();
updateStickerTray();
initGame();
</script>
